<h2>两种方案对比</h2>
<p class="subtitle">点击选择你喜欢的方案</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>侧边栏扩展</h3>
      <p>在现有任务列表下方添加任务详情面板，显示 ID、名称、描述、分类</p>
      <ul style="margin: 8px 0 0; padding-left: 16px; font-size: 12px; color: #6b7280;">
        <li>统一风格，与任务列表在一起</li>
        <li>不需要改变整体布局</li>
        <li>侧边栏需要变宽或滚动</li>
      </ul>
    </div>
  </div>
  
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>顶部信息栏</h3>
      <p>在 Header 和画布之间新增深色信息栏，一目了然地显示所有任务信息</p>
      <ul style="margin: 8px 0 0; padding-left: 16px; font-size: 12px; color: #6b7280;">
        <li>信息一目了然，空间宽敞</li>
        <li>不占用侧边栏空间</li>
        <li>需要新增顶部区域</li>
      </ul>
    </div>
  </div>
</div>

<div style="margin-top: 32px;">
  <h3>快速预览</h3>
  <div class="split" style="margin-top: 16px;">
    <div class="mockup">
      <div class="mockup-header">方案 A - 侧边栏</div>
      <div class="mockup-body" style="padding: 16px; background: #f9fafb;">
        <div style="font-size: 11px; color: #6b7280; margin-bottom: 8px;">任务详情</div>
        <div style="background: #f3f4f6; border-radius: 8px; padding: 12px; font-size: 12px;">
          <div style="margin-bottom: 8px;"><strong>ID:</strong> <span style="font-family: monospace;">quest_001</span></div>
          <div style="margin-bottom: 8px;"><strong>名称:</strong> <input style="padding: 4px; border: 1px solid #d1d5db; border-radius: 4px; width: 100%;" value="每日任务" /></div>
          <div style="margin-bottom: 8px;"><strong>描述:</strong> <textarea style="padding: 4px; border: 1px solid #d1d5db; border-radius: 4px; width: 100%;">每天完成指定任务</textarea></div>
          <div><strong>分类:</strong> <select style="padding: 4px; border: 1px solid #d1d5db; border-radius: 4px; width: 100%;"><option>日常任务</option></select></div>
        </div>
      </div>
    </div>
    
    <div class="mockup">
      <div class="mockup-header">方案 B - 顶部栏</div>
      <div class="mockup-body" style="padding: 16px; background: #1e293b;">
        <div style="display: flex; gap: 16px; font-size: 12px; color: #e2e8f0;">
          <div style="flex: 1;">
            <div style="font-size: 10px; color: #94a3b8; margin-bottom: 4px;">ID</div>
            <div style="font-family: monospace; color: #e2e8f0;">quest_001</div>
          </div>
          <div style="flex: 2;">
            <div style="font-size: 10px; color: #94a3b8; margin-bottom: 4px;">名称</div>
            <input style="width: 100%; padding: 6px 10px; background: #334155; border: 1px solid #475569; border-radius: 4px; color: white;" value="每日任务" />
          </div>
          <div style="flex: 1;">
            <div style="font-size: 10px; color: #94a3b8; margin-bottom: 4px;">分类</div>
            <select style="width: 100%; padding: 6px 10px; background: #334155; border: 1px solid #475569; border-radius: 4px; color: white;">
              <option>日常任务</option>
            </select>
          </div>
        </div>
        <div style="margin-top: 12px;">
          <div style="font-size: 10px; color: #94a3b8; margin-bottom: 4px;">描述</div>
          <input style="width: 100%; padding: 6px 10px; background: #334155; border: 1px solid #475569; border-radius: 4px; color: #e2e8f0;" value="每天完成指定任务获取奖励" />
        </div>
      </div>
    </div>
  </div>
</div>
