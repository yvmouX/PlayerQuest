<h2>方案 B - 画布顶部信息栏</h2>
<p class="subtitle">在编辑器顶部 Header 和画布之间显示任务信息</p>

<div class="mockup">
  <div class="mockup-header">顶部信息栏布局预览</div>
  <div class="mockup-body">
    <div style="height: 420px; background: #f5f5f5; font-family: system-ui; font-size: 13px; display: flex; flex-direction: column;">
      <!-- Header -->
      <div style="background: white; border-bottom: 1px solid #e5e7eb; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;">
        <div style="font-weight: 600; font-size: 16px;">任务编辑器</div>
        <div style="display: flex; gap: 8px;">
          <button style="padding: 6px 12px; border: 1px solid #3b82f6; background: white; color: #3b82f6; border-radius: 6px; cursor: pointer;">加载示例</button>
          <button style="padding: 6px 12px; border: 1px solid #3b82f6; background: white; color: #3b82f6; border-radius: 6px; cursor: pointer;">帮助</button>
          <button style="padding: 6px 12px; border: none; background: #3b82f6; color: white; border-radius: 6px; cursor: pointer;">保存</button>
        </div>
      </div>
      
      <!-- Quest Info Bar -->
      <div style="background: #1e293b; padding: 16px 24px; display: flex; gap: 24px; align-items: center;">
        <div style="flex: 1;">
          <label style="font-size: 10px; color: #94a3b8; display: block; margin-bottom: 4px;">任务 ID</label>
          <div style="font-size: 12px; color: #e2e8f0; font-family: monospace;">quest_daily_001</div>
        </div>
        <div style="flex: 2;">
          <label style="font-size: 10px; color: #94a3b8; display: block; margin-bottom: 4px;">任务名称</label>
          <input style="width: 100%; padding: 8px 12px; background: #334155; border: 1px solid #475569; border-radius: 6px; color: white; font-size: 14px; font-weight: 500;" value="每日任务" />
        </div>
        <div style="flex: 2;">
          <label style="font-size: 10px; color: #94a3b8; display: block; margin-bottom: 4px;">任务分类</label>
          <select style="width: 100%; padding: 8px 12px; background: #334155; border: 1px solid #475569; border-radius: 6px; color: white; font-size: 12px;">
            <option>日常任务</option>
            <option>主线任务</option>
            <option>支线任务</option>
            <option>活动任务</option>
          </select>
        </div>
        <div style="flex: 3;">
          <label style="font-size: 10px; color: #94a3b8; display: block; margin-bottom: 4px;">任务描述</label>
          <input style="width: 100%; padding: 8px 12px; background: #334155; border: 1px solid #475569; border-radius: 6px; color: #e2e8f0; font-size: 12px;" value="每天完成指定任务获取奖励" />
        </div>
      </div>
      
      <!-- Main Area -->
      <div style="flex: 1; display: flex;">
        <!-- Sidebar -->
        <div style="width: 200px; background: white; border-right: 1px solid #e5e7eb; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
          <div style="font-size: 11px; color: #6b7280; text-transform: uppercase; font-weight: 600;">任务列表</div>
          <div style="background: #dbeafe; border: 1px solid #3b82f6; border-radius: 6px; padding: 10px;">
            <div style="font-weight: 500;">每日任务</div>
          </div>
          <div style="background: #f3f4f6; border-radius: 6px; padding: 10px;">
            <div style="font-weight: 500;">新手任务</div>
          </div>
          <button style="background: #8b5cf6; color: white; border: none; border-radius: 6px; padding: 8px; cursor: pointer;">+ 新建任务</button>
          
          <div style="font-size: 11px; color: #6b7280; text-transform: uppercase; font-weight: 600; margin-top: 8px;">节点工具</div>
          <div style="background: #f3f4f6; padding: 8px; border-radius: 4px; font-size: 12px; text-align: center;">⚡ Trigger</div>
          <div style="background: #f3f4f6; padding: 8px; border-radius: 4px; font-size: 12px; text-align: center;">🎯 Objective</div>
        </div>
        
        <!-- Canvas -->
        <div style="flex: 1; background: #e5e7eb; display: flex; align-items: center; justify-content: center;">
          <div style="color: #9ca3af;">画布区域</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="pros-cons" style="margin-top: 24px;">
  <div class="pros">
    <h4>优点</h4>
    <ul>
      <li>任务信息一目了然</li>
      <li>不占用侧边栏空间</li>
      <li>信息展示更宽敞</li>
    </ul>
  </div>
  <div class="cons">
    <h4>缺点</h4>
    <ul>
      <li>需要新增顶部区域</li>
      <li>没有选择任务时显示空白</li>
    </ul>
  </div>
</div>
