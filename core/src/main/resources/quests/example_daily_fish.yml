# 示例任务：随插件发布（jar 内的 quests/），只在 quests/ 目录空着时铺一份到这里，之后插件不再动它。
# 文件名（去掉扩展名）就是 id，因此这里不必再写 id；改完执行 /ptxa reload 生效。
# 文件里的定义是只读的：编辑器与游戏内命令只改数据库里的定义；要在这里改就改文件，
# 想搬进数据库就用编辑器的「导出 / 导入 YAML」。不需要就删掉——目录非空时不会再补。

name: <yellow>渔夫的一天
description:
- <gray>钓上 5 条鱼（任意种类）
- <gray>完成后可领取 5 个熟鲑鱼
icon: FISHING_ROD
category: 每日
type: DAILY
refreshCost: 1000
enabled: true
objectives:
- type: fish
  properties:
    amount: 5
    target: ''
rewards:
- type: command
  properties:
    command: give %player% cooked_salmon 5
