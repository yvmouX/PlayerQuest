# 示例任务：随插件发布（jar 内的 quests/），只在 quests/ 目录空着时铺一份到这里，之后插件不再动它。
# 文件名（去掉扩展名）就是 id，因此这里不必再写 id；改完执行 /ptxa reload 生效。
# 文件里的定义是只读的：游戏内命令只改数据库里的定义；要在这里改就改文件，然后 /ptxa reload。
# 想搬进数据库就照着这里的内容在游戏内重建一条，并把本文件删掉或改名。不需要就删掉——目录非空时不会再补。

name: <gold>附魔师
description:
- <gray>完成 10 次附魔（任意附魔）
- <gray>完成后可领取 32 个青金石
icon: ENCHANTING_TABLE
category: 常驻
type: NORMAL
refreshCost: 0
enabled: true
objectives:
- type: enchant
  properties:
    amount: 10
    target: ''
rewards:
- type: command
  properties:
    command: give %player% lapis_lazuli 32
