editor:
  # 是否启用编辑器
  enabled: true

  # 编辑器服务器端口
  port: 1145

  # 绑定的主机地址
  host: 127.0.0.1

  # 令牌有效期（秒）
  token-expiry: 3600

  # 最大同时编辑会话数
  max-sessions: 10

  # 允许访问的IP列表（支持CIDR）
  allowed-ips:
    - "127.0.0.1"
    - "localhost"
    - "192.168.1.0/24"

  # 启用HTTPS（需要证书）
  ssl:
    enabled: false
    keystore-path: ""
    keystore-password: ""

  # 跨域设置
  cors:
    enabled: true
    allowed-origins:
      - "http://localhost:*"
      - "http://127.0.0.1:*"

  # MySQL配置
  mysql:
    host: "localhost"
    port: 3306
    database: "minecraft"
    username: "root"
    password: ""
    use-ssl: false
    pool-size: 10

  # 连接池设置
  connection-pool:
    max-pool-size: 20
    min-idle: 5
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000
storage:
  type: sqlite
  sqlite:
    file: data.db
  mysql:
    host: "localhost"
    port: 3306
    database: "minecraft"
    username: "root"
    password: ""
    use-ssl: false
    pool-size: 10
  connection-pool:
    max-pool-size: 20
    min-idle: 5
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000

cache:
  enabled: true
  ttl: 300




# TODO FEATURE
# 任务默认设置
quests:
  # 默认奖励
  default-rewards:
    - type: "experience"
      amount: 100
    - type: "money"
      amount: 50.0

  # 任务类型
  types:
    - "single"
    - "chain"
    - "daily"
    - "weekly"
    - "event"

  # 自动保存间隔（分钟）
  auto-save-interval: 5

  # 是否自动备份
  auto-backup: true
  backup-keep-days: 7

# 多语言配置
locales:
  # 默认语言
  default: "zh-CN"

  # 可用语言
  available:
    - "zh-CN"
    - "en-US"
    - "ja-JP"

  # 语言文件目录
  directory: "locales"

# 编辑器功能开关
features:
  # 是否启用实时协同编辑
  collaborative-editing: false

  # 是否启用版本历史
  version-history: true
  max-history-versions: 50

  # 是否启用自动完成
  auto-completion: true

  # 是否启用语法检查
  syntax-validation: true

  # 是否启用任务模板
  templates: true

# 玩家进度设置
progress:
  # 是否自动清理离线玩家数据
  auto-cleanup: false
  cleanup-days: 30

  # 进度缓存大小
  cache-size: 1000

  # 是否记录进度历史
  track-history: true

# 统计设置
statistics:
  # 数据保留天数
  retention-days: 90

  # 实时统计更新间隔（秒）
  update-interval: 60

  # 是否启用高级统计
  advanced: true

# 日志设置
logging:
  # 编辑器访问日志
  access-log: true
  access-log-file: "logs/editor-access.log"

  # API请求日志
  api-log: true
  api-log-level: "INFO"

  # 数据库操作日志
  db-log: false

  # WebSocket连接日志
  websocket-log: true

# 安全设置
security:
  # 是否启用IP白名单
  ip-whitelist: false

  # 最大请求大小（MB）
  max-request-size: 10

  # 是否启用请求速率限制
  rate-limiting:
    enabled: true
    requests-per-minute: 60

  # 是否启用API密钥认证（第三方集成）
  api-keys:
    enabled: false
    keys: []