# PlayerTaskX language file (English)
# MiniMessage tags are supported (<red>, <bold>, ...), legacy & color codes also work.
# Placeholders are numeric: {0}, {1}, ... replaced in order.
#
# There is deliberately no prefix key (MessageSettings is built without prefixKey):
# multi-line output such as /ptxa list goes through sendRaw, which does add the
# prefix - enabling it would put a [PlayerTaskX] in front of every single line.

# ---------- Common ----------
common:
  # yes / no must stay quoted: YAML 1.1 reads a bare yes/no/on/off as a boolean, so the key
  # would be parsed as common.true and lookups of common.yes would report a missing key.
  "yes": "Yes"
  "no": "No"
  none: "None"

# ---------- Objective type names ----------
objective:
  break_block: "Mine"
  place_block: "Place"
  craft: "Craft"
  fish: "Fish"
  custom_fish: "Custom fishing"
  kill: "Kill"
  consume: "Consume"
  enchant: "Enchant"
  shear: "Shear"
  breed: "Breed"
  tame: "Tame"
  interact: "Interact"
  chat: "Chat"
  submit: "Submit"
  command: "Run command"

# ---------- Reward type names ----------
reward:
  money: "Money"
  points: "Points"
  exp: "Experience"
  item: "Item"
  command: "Custom command"

# ---------- Quests ----------
quest:
  progress: "Quest progress"
  completed-title: "<green>✔ Quest complete</green>"
  claimed: "<green>Reward claimed: </green><white>{0}</white>"
  not-completed: "<red>This quest is not complete yet.</red>"
  already-claimed: "<red>This reward has already been claimed.</red>"
  unavailable: "<red>This quest is currently unavailable, please contact an administrator.</red>"
  refreshed: "<green>{0} quests refreshed.</green>"
  refresh-failed: "<red>Refresh failed: {0}</red>"
  refresh-limit: "<red>You have used all {0} refreshes (limit {1}).</red>"
  refresh-cost: "<gray>This refresh cost {0}.</gray>"
  not-found: "<red>Quest not found: {0}</red>"
  # Reward claim blocked by prerequisites. {0} lists the prerequisite quest names.
  # The criterion is "reward already claimed", so the wording must say claimed, not completed.
  locked: "<red>Prerequisite quests not claimed yet: {0}</red>"
  # Same family as gui.in-progress / completed / claimed: quest status text for
  # placeholders. The caller passes 0 arguments and strips formatting, so no {0}.
  abandoned: "<gray>Abandoned</gray>"

# ---------- Periodic quests (daily / weekly / monthly / custom) ----------
periodic:
  none: "<gray>No quests in this period.</gray>"
  # {0} is the period name
  reset: "<green>A new {0} has started - your quests have been reset.</green>"
  section: "<aqua>{0} quests:</aqua>"
  unknown-type: "<red>Unknown period type: {0} (available: daily / weekly / monthly / custom)</red>"

# ---------- Commands ----------
command:
  player-only: "<red>This command can only be used by players.</red>"
  player-help: "Player commands"
  admin-help: "Admin commands"
  reloaded: "<green>Configuration and quests reloaded ({0} quests).</green>"
  reload-failed: "<red>Reload failed: {0}</red>"

# ---------- GUI ----------
gui:
  periodic-title: "Periodic Quests"
  periodic-button: "{0}"
  periodic-current: "<green>Viewing this period</green>"
  periodic-switch: "<gray>Click to switch</gray>"
  quest-detail-title: "Quest: {0}"
  admin-title: "Quest Admin"
  click-to-view: "<yellow>Click for details</yellow>"
  click-to-claim: "<green>Click to claim reward</green>"
  in-progress: "<gray>In progress</gray>"
  completed: "<green>Completed - ready to claim</green>"
  claimed: "<gray>Claimed</gray>"
  page-info: "<gray>Page {0}/{1}</gray>"
  previous: "<yellow>Previous</yellow>"
  next: "<yellow>Next</yellow>"
  close: "<red>Close</red>"
  back: "<yellow>Back</yellow>"
  refresh: "<yellow>Refresh quests</yellow>"
  refresh-cost: "<yellow>Refresh ({0})</yellow>"
  # Prerequisites: item name plus the three status lines (todo / done / not judgeable)
  prerequisites: "<yellow>Prerequisites"
  prerequisite-todo: "<red>✘ {0} (not claimed yet)</red>"
  prerequisite-done: "<green>✔ {0}</green>"
  prerequisite: "<gray>{0}</gray>"

# ---------- Editor ----------
editor:
  started: "<green>Web editor started at </green><white>http://{0}</white>"
  disabled: "<gray>Web editor is disabled.</gray>"
  token: "<gray>Access token: <white>{0}</white></gray>"
  token-required: "<red>Access token is missing, please set editor.token in the config.</red>"

# ---------- Errors ----------
error:
  internal: "<red>Operation failed, check the console log.</red>"
