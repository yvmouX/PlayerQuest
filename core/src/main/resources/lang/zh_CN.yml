# PlayerTaskX 语言文件（简体中文）
# 支持 MiniMessage 标签（<red>、<bold> 等），也兼容传统 & 颜色代码。
# 占位符为数字形式：{0}、{1} …，按顺序替换。

prefix: "<gray>[</gray><aqua>PlayerTaskX</aqua><gray>]</gray> "

# ---------- 通用 ----------
common:
  yes: "是"
  no: "否"
  none: "无"
  loading: "加载中…"

# ---------- 目标类型显示名（进度展示与 GUI 使用） ----------
objective:
  break_block: "挖掘"
  place_block: "放置"
  craft: "合成"
  fish: "垂钓"
  kill: "击杀"
  consume: "消耗"
  enchant: "附魔"
  shear: "剪切"
  breed: "繁殖"
  tame: "驯服"
  interact: "交互"
  chat: "发言"
  submit: "提交"
  command: "执行命令"

# ---------- 奖励类型显示名 ----------
reward:
  money: "金币"
  points: "点券"
  quest_coin: "任务币"
  item: "物品"
  command: "自定义命令"

# ---------- 任务相关 ----------
quest:
  progress: "任务进度"
  completed-title: "<green>✔ 任务完成</green>"
  completed-subtitle: "<white>{0}</white>"
  completed-message: "<green>任务已完成：</green><white>{0}</white><gray>，可在任务界面领取奖励。</gray>"
  claimed: "<green>已领取奖励：</green><white>{0}</white>"
  not-completed: "<red>该任务尚未完成，无法领取奖励。</red>"
  already-claimed: "<red>该任务的奖励已经领取过了。</red>"
  unavailable: "<red>该任务当前不可用，请联系管理员。</red>"
  accepted: "<green>已接取任务：</green><white>{0}</white>"
  abandoned: "<yellow>已放弃任务：</yellow><white>{0}</white>"
  refreshed: "<green>每日任务已刷新。</green>"
  refresh-failed: "<red>刷新失败：{0}</red>"
  refresh-limit: "<red>今日刷新次数已用完（上限 {0} 次）。</red>"
  refresh-cost: "<gray>本次刷新消耗 {0}。</gray>"
  not-found: "<red>找不到任务：{0}</red>"

# ---------- 每日任务 ----------
daily:
  none: "<gray>今日暂无每日任务。</gray>"
  reset: "<green>新的一天，每日任务已重置。</green>"

# ---------- 命令 ----------
command:
  player-only: "<red>该命令只能由玩家执行。</red>"
  no-permission: "<red>你没有权限执行该命令。</red>"
  unknown-subcommand: "<red>未知的子命令：{0}</red>"
  reloaded: "<green>配置与任务已重载（{0} 个任务）。</green>"
  reload-failed: "<red>重载失败：{0}</red>"

# ---------- GUI ----------
gui:
  daily-title: "每日任务"
  quest-list-title: "任务列表"
  quest-detail-title: "任务详情：{0}"
  reward-title: "任务奖励"
  admin-title: "任务管理"
  objective-title: "编辑任务目标"
  reward-edit-title: "编辑任务奖励"
  click-to-view: "<yellow>点击查看详情</yellow>"
  click-to-claim: "<green>点击领取奖励</green>"
  in-progress: "<gray>进行中</gray>"
  completed: "<green>已完成，可领取</green>"
  claimed: "<gray>已领取</gray>"
  page-info: "<gray>第 {0}/{1} 页</gray>"
  previous: "<yellow>上一页</yellow>"
  next: "<yellow>下一页</yellow>"
  close: "<red>关闭</red>"
  back: "<yellow>返回</yellow>"

# ---------- 编辑器 ----------
editor:
  started: "<green>网页编辑器已启动：</green><white>http://{0}</white>"
  disabled: "<gray>网页编辑器未启用。</gray>"
  token-required: "<red>缺少访问令牌，请在配置中设置 editor.token。</red>"

# ---------- 错误 ----------
error:
  internal: "<red>操作失败，请查看控制台日志。</red>"
