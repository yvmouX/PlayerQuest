# PlayerTaskX 语言文件（简体中文）
# 支持 MiniMessage 标签（<red>、<bold> 等），也兼容传统 & 颜色代码。
# 占位符为数字形式：{0}、{1} …，按顺序替换。
#
# 这里刻意没有 prefix 键（构建 MessageSettings 时也不调用 prefixKey），
# 因为多行输出（如 /ptxa list）走的是 sendRaw，而 sendRaw 会加前缀——
# 一旦启用，每一行都会被顶上一个 [PlayerTaskX]，把原本的排版彻底打乱。

# ---------- 通用 ----------
common:
  # yes / no 必须带引号：YAML 1.1 把裸写的 yes、no、on、off 当布尔值，键名会被解析成
  # common.true，代码查 common.yes 时只会得到「缺少语言键」。LanguageFileTest 钉住了这一点。
  "yes": "是"
  "no": "否"
  none: "无"

# ---------- 目标类型显示名（进度展示与 GUI 使用） ----------
objective:
  break_block: "挖掘"
  place_block: "放置"
  craft: "合成"
  fish: "垂钓"
  custom_fish: "自定义钓鱼"
  kill: "击杀"
  consume: "消耗"
  enchant: "附魔"
  shear: "剪切"
  breed: "繁殖"
  tame: "驯服"
  interact: "交互"
  chat: "发言"
  submit: "提交"
  command: "执行命令"

# ---------- 奖励类型显示名 ----------
reward:
  money: "金币"
  points: "点券"
  exp: "经验"
  item: "物品"
  command: "自定义命令"

# ---------- 任务相关 ----------
quest:
  progress: "任务进度"
  completed-title: "<green>✔ 任务完成</green>"
  claimed: "<green>已领取奖励：</green><white>{0}</white>"
  not-completed: "<red>该任务尚未完成，无法领取奖励。</red>"
  already-claimed: "<red>该任务的奖励已经领取过了。</red>"
  unavailable: "<red>该任务当前不可用，请联系管理员。</red>"
  refreshed: "<green>每日任务已刷新。</green>"
  refresh-failed: "<red>刷新失败：{0}</red>"
  refresh-limit: "<red>今日刷新次数已用完（上限 {0} 次）。</red>"
  refresh-cost: "<gray>本次刷新消耗 {0}。</gray>"
  not-found: "<red>找不到任务：{0}</red>"
  # 前置任务未全部领取时领取奖励的提示。{0} 是未满足的前置任务名（多个用逗号分隔）。
  # 判定标准是「已领取奖励」而不是「已完成」，措辞必须与此一致，否则玩家会以为做完了就能领。
  locked: "<red>前置任务尚未全部领取：{0}</red>"
  # 与 gui.in-progress / completed / claimed 同族：占位符里的任务状态文案。
  # 调用方传 0 个参数并会 strip 掉格式，因此不要写 {0}。
  abandoned: "<gray>已放弃</gray>"

# ---------- 每日任务 ----------
daily:
  none: "<gray>今日暂无每日任务。</gray>"
  reset: "<green>新的一天，每日任务已重置。</green>"

# ---------- 命令 ----------
command:
  player-only: "<red>该命令只能由玩家执行。</red>"
  player-help: "玩家命令"
  admin-help: "管理员命令"
  reloaded: "<green>配置与任务已重载（{0} 个任务）。</green>"
  reload-failed: "<red>重载失败：{0}</red>"

# ---------- GUI ----------
gui:
  daily-title: "每日任务"
  quest-detail-title: "任务详情：{0}"
  admin-title: "任务管理"
  click-to-view: "<yellow>点击查看详情</yellow>"
  click-to-claim: "<green>点击领取奖励</green>"
  in-progress: "<gray>进行中</gray>"
  completed: "<green>已完成，可领取</green>"
  claimed: "<gray>已领取</gray>"
  page-info: "<gray>第 {0}/{1} 页</gray>"
  previous: "<yellow>上一页</yellow>"
  next: "<yellow>下一页</yellow>"
  close: "<red>关闭</red>"
  back: "<yellow>返回</yellow>"
  refresh: "<yellow>刷新每日任务</yellow>"
  refresh-cost: "<yellow>刷新（{0}）</yellow>"
  # 前置任务：物品名 + 三种状态行（未达成 / 已达成 / 管理员预览时不判定）
  prerequisites: "<yellow>前置任务"
  prerequisite-todo: "<red>✘ {0}（尚未领取）</red>"
  prerequisite-done: "<green>✔ {0}</green>"
  prerequisite: "<gray>{0}</gray>"

# ---------- 编辑器 ----------
editor:
  started: "<green>网页编辑器已启动：</green><white>http://{0}</white>"
  disabled: "<gray>网页编辑器未启用。</gray>"
  token: "<gray>访问令牌：<white>{0}</white></gray>"
  token-required: "<red>缺少访问令牌，请在配置中设置 editor.token。</red>"

# ---------- 错误 ----------
error:
  internal: "<red>操作失败，请查看控制台日志。</red>"
