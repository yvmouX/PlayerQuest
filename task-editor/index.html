<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MC Quest Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              mc: {
                dark: '#1d1d1d',
                panel: '#2c2c2c',
                accent: '#3b8526', // Minecraft Green
                text: '#dddddd',
                border: '#4a4a4a'
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom Scrollbar for a more integrated feel */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1d1d1d;
      }
      ::-webkit-scrollbar-thumb {
        background: #4a4a4a;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #5a5a5a;
      }
    </style>
